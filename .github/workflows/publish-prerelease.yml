name: Publish Prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease tag (e.g., alpha, beta, rc)'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - rc

concurrency:
  group: publish-prerelease
  cancel-in-progress: false # Don't cancel publish in progress

jobs:
  publish-prerelease:
    name: Publish Prerelease (${{ inputs.tag }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # For npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable


      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: Run tests
        run: yarn test

      # Same entry point as release.yml, for the same reasons: `changeset publish`
      # ships `workspace:*` ranges and the withheld packages
      # (DZUP-UI-PUBLISH-PATH-20260925-R1).
      - name: Publish prerelease
        run: |
          yarn release:publish --provenance --tag ${{ inputs.tag }}
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
