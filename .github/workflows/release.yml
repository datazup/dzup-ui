name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # Don't cancel release in progress

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # For creating tags and GitHub releases
      pull-requests: write # For creating version PRs
      id-token: write # For npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for changeset version

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable


      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: Run tests
        run: yarn test

      # DZUP-UI-PUBLISH-PATH-20260925-R1. The version commit is never checked by
      # CI: changesets/action opens the release PR with GITHUB_TOKEN, and PRs
      # opened that way trigger no workflows. So the push that merges it lands
      # here unvalidated, one step from `changeset publish`. These are the gates
      # a version commit can break (headings, the mcp server.json version, the
      # release policy, engine declarations), plus a dry run of the exact
      # publish command, which packs every published package without uploading.
      - name: Release gates
        run: |
          yarn validate:changelog
          yarn validate:release-policy
          yarn validate:mcp
          yarn validate:engines
          yarn release:publish --dry-run

      # UI-DZUP-UI-SEC-M-09. The npm token reaches one step: "Publish to npm",
      # which runs only the publish script over output built before it. Every
      # step that executes repository or dependency code — the install (which
      # runs lifecycle scripts), the builds, `yarn version-packages` — runs with
      # no npm token in its environment, so a compromised build or install-time
      # dependency has nothing to read. Pinned by
      # packages/tooling/src/release/release-workflow.spec.ts.
      #
      # With changesets pending this opens or updates the release PR and the
      # steps below are skipped. With none pending (the release PR has merged) it
      # does nothing, and the steps below build, publish and tag.
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A clean rebuild, as `yarn release` did inside the publish step before the
      # token was scoped: the tests above may have regenerated artifacts.
      - name: Build release artifacts
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: yarn build

      # Packs and uploads the prebuilt output; no published package declares a
      # pack or publish lifecycle script.
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: yarn release:publish --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `yarn npm publish` (release:publish) reads its token from here, not
          # from setup-node's .npmrc, and publishes to registry.yarnpkg.com
          # unless told otherwise. The token and the provenance attestation
          # both belong to registry.npmjs.org.
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org

      # `changeset tag` prints a `New tag:` line per released package; the
      # action pushes those tags and opens a GitHub release for each, as it did
      # when `yarn release` ended with the same command.
      - name: Tag and create GitHub releases
        if: steps.changesets.outputs.hasChangesets == 'false'
        uses: changesets/action@v1
        with:
          publish: yarn changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
