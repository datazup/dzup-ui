name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # Don't cancel release in progress

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # For creating tags and GitHub releases
      pull-requests: write # For creating version PRs
      id-token: write # For npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for changeset version

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable


      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: yarn build

      - name: Run tests
        run: yarn test

      # DZUP-UI-PUBLISH-PATH-20260925-R1. The version commit is never checked by
      # CI: changesets/action opens the release PR with GITHUB_TOKEN, and PRs
      # opened that way trigger no workflows. So the push that merges it lands
      # here unvalidated, one step from `changeset publish`. These are the gates
      # a version commit can break (headings, the mcp server.json version, the
      # release policy, engine declarations), plus a dry run of the exact
      # publish command, which packs every published package without uploading.
      - name: Release gates
        run: |
          yarn validate:changelog
          yarn validate:release-policy
          yarn validate:mcp
          yarn validate:engines
          yarn release:publish --dry-run

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          publish: yarn release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `yarn npm publish` (release:publish) reads its token from here, not
          # from setup-node's .npmrc, and publishes to registry.yarnpkg.com
          # unless told otherwise. The token and the provenance attestation
          # both belong to registry.npmjs.org.
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
