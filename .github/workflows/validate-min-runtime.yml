# The declared Node floor, exercised (ADR-18, TASK-OSS-P2-01, TASK-R1-O4).
#
# WHY IT IS ITS OWN FILE
# ----------------------
# It was a job inside ci.yml, which made it unreachable by `gh workflow run`:
# ci.yml triggers on push and pull_request only, so the only way to ask "does
# the floor still hold?" was to push a commit and wait for the whole graph.
# 1.0 criterion C10 is a claim about a runtime, and a claim you cannot re-check
# on demand is a claim nobody re-checks.
#
# It is a REUSABLE workflow (`workflow_call`) so ci.yml still runs it on every
# push exactly as before — the blocking CI graph is unchanged — while
# `workflow_dispatch` makes it answerable at any ref, on its own, in ~6 minutes
# instead of ~15.
#
# WHAT IT PROVES, AND WHAT IT DOES NOT
# ------------------------------------
# A contributor who satisfies `engines` must be able to run every mandatory
# gate. Before this job that was a claim: every other CI job requested
# `node-version: '20.19.0'` as a literal or `20` as a floating major, and the
# declared floor was never the one anything ran on. `.nvmrc` holds the floor and
# this workflow reads it, so there is one number.
#
# It does NOT prove anything about Node 22 or 24 — the upper half of
# `^20.19.0 || >=22.13.0` is covered by the `test` matrix in ci.yml.
#
# TASK-R1-O4 fixed two defects that made every historical run of this job
# unreadable; both are commented at the step that carried them.
name: Validate min runtime

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # `github.workflow` is part of the key because a reusable workflow inherits
  # the CALLER's name: it is `CI` when ci.yml calls this file and
  # `Validate min runtime` on a direct dispatch. Without it, dispatching this
  # workflow while CI is running on the same ref would cancel CI's copy of it —
  # a hand-run check silently killing the blocking one.
  group: min-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-min-runtime:
    name: Validators at the minimum runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # validate:all includes validate:capability-matrix, which stamps each
          # component with the commit that last touched it (`git log -1 -- <file>`).
          # A depth-1 clone answers HEAD for every file, so the committed matrix
          # can never match.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Report the runtime under test
        run: node -v
      # No cache restore, on purpose: this job answers "does a clean checkout
      # work at the floor?", and a warm cache from a newer-Node job could hide
      # an install-time engine rejection.
      - name: Install dependencies (clean)
        run: yarn install --immutable
      # The declarations agree, and every gate dependency accepts the floor.
      - name: Engine declarations
        run: yarn validate:engines
      # Each generator must START. A startup error — ERR_UNKNOWN_FILE_EXTENSION,
      # SyntaxError, Unsupported engine — is the failure this step exists to
      # catch, and it is indistinguishable from "there is no gate".
      - name: Generators
        run: |
          yarn generate:exports:core
          yarn generate:ownership:core
      # DEFECT 1, fixed here (TASK-R1-O4).
      #
      # `generate:exports:core` REWRITES packages/core/src/index.ts from
      # public-api.manifest.json. The rewrite drops the barrel's comments and
      # emits the export lines in an order `perfectionist/sort-exports` rejects,
      # so without the restore below `yarn validate:all` fails at its `lint` link
      # and blames Node 20.19.0 for a file the repository never committed. That
      # is how the runs up to 2026-09-20 went red.
      #
      # Restoring the tree keeps this step's actual question — do the generators
      # START at the floor? — and stops it from answering a different one.
      # Whether the manifest and the barrel agree on the export lines is a
      # release question, answered by `release:api-diff` (barrel drift, clean
      # since 3c3f94a), not by this job.
      - name: Restore the tree the generators rewrote
        run: |
          git checkout -- .
          git status --porcelain
      # DEFECT 2, fixed here (TASK-R1-O4).
      #
      # `yarn validate:all` used to run before any build. On a clean checkout
      # `dist/` does not exist — ADR-12, generated dist is published, never
      # committed — and the root vitest/vite configs resolve `@dzup-ui/tokens/css`,
      # `/css/high-contrast`, `/tailwind` and `/dtcg` to built artifacts that
      # have no source equivalent. Four links of the chain (`validate:tokens:dtcg`,
      # `validate:externals`, `validate:dts`, `validate:tree-shake`) read dist
      # directly, and `yarn test` below cannot even load its config without it:
      #
      #     ✗ createDzupResolution: @dzup-ui/tokens/dtcg points at
      #       `./dist/tokens.dtcg.json`, and neither a source equivalent nor the
      #       built artifact exists.
      #
      # Building first is also what a contributor does, which is the scenario
      # this job exists to reproduce. It costs nothing: the build below was
      # already in the job, this only moves it earlier.
      - name: Build at the floor
        run: yarn build
      # Every validator named in `validate:all`, run as the chain so the report
      # says which link failed rather than which script did.
      #
      # `validate:docs-size` (link 38) fails closed under `CI` when the docs site
      # or Storybook has not been built, and this job builds neither — so every
      # run failed there, blaming the floor for a missing artifact (TASK-R4).
      # The budget is a property of the built artifact, not of the Node version,
      # so it is enforced where the artifact is built (the `storybook` job in
      # ci.yml) and this job opts that one link out.
      - name: Validators
        run: yarn validate:all
        env:
          DOCS_SIZE_ALLOW_MISSING_DIST: '1'
      # The gate whose own dependencies (vite, jsdom) set the floor in the first
      # place: both require `^20.19.0`, which is why `engines` says so.
      - name: Test at the floor
        run: yarn test
