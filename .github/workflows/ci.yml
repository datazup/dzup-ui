name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # G0: PR Gates (blocking)
  # ──────────────────────────────────────────────

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      # Blocking. Covers every package AND apps/landing (`typecheck:apps`, folded
      # into typecheck:all by TASK-FREE2-01). apps/storybook is typechecked by its
      # build in the `storybook` job instead — see docs/storybook-decisions.md.
      - name: Typecheck (all packages + apps/landing)
        run: yarn typecheck:all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      # Blocking, and zero-tolerance: `--max-warnings 0`. Covers packages/ AND both
      # free-tier apps (TASK-FREE2-01 — the script read `eslint packages/` for
      # months, so neither public-facing app was ever linted). The baseline is 0
      # errors / 0 warnings; a "known baseline" that exits 1 is a gate people learn
      # to ignore. Generated output is excluded via eslint.config.js `ignores`.
      - name: ESLint (packages + apps, zero warnings)
        run: yarn lint

  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run tests
        run: yarn test
      - name: Run contract tests
        run: yarn test:contracts
      - name: Run a11y tests
        run: yarn test:a11y
      - name: Run SSR smoke tests
        run: yarn test:ssr

  validate:
    name: Validate (boundaries + tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Import boundary validation
        run: yarn validate:boundaries
      - name: Interaction contract validation
        run: yarn validate:interaction-contract
      # Every component the story corpus showcases must have a contract spec.
      # Replaces the old sandbox-parity gate (TASK-FREE-16): apps/sandbox was
      # retired, and the stories import a strict superset of what it did.
      - name: Contract parity
        run: yarn validate:contract-parity
      # Every `Core/<Family>/<Component>` story must carry exactly one `status:*`
      # tag, and a deprecated one must name its replacement. ComponentStatus.mdx
      # tells readers this is enforced; until now nothing ran it (TASK-FREE-12).
      - name: Story status tags
        run: yarn validate:story-status
      # The story Definition of Done in Contributing.mdx, machine-checked
      # (TASK-FREE-15). Enforced today: a controls-driven story, a dark-mode
      # preview, and a rendered component description. The remaining DoD items
      # are reported with their counts rather than enforced — see the ratchet
      # note in packages/tooling/src/validators/story-dod.ts.
      - name: Story definition of done
        run: yarn validate:story-dod
      - name: Token compliance check
        run: yarn validate:tokens
      - name: Export map validation
        run: yarn validate:exports
      - name: Token build artifacts unchanged
        run: |
          yarn tokens:generate
          git diff --exit-code packages/tokens/dist/
      # The landing's generated artifacts get the same guard the tokens dist has
      # above (TASK-FREE-18). They are committed on purpose — specs import them
      # under a bare `yarn test`, with no build step to write them first; see
      # apps/landing/src/generated/README.md — and they were ALSO regenerated by
      # every build with nothing checking the committed copy still matched its
      # source. It didn't: 91 registry files were stale, still advertising the
      # pre-404 `/blocks#<id>` anchors and an outdated block source.
      #
      # `build:stats` is excluded deliberately: liveStats.ts depends on the live
      # GitHub/npm APIs, so a legitimate refresh would fail this check. It is the
      # one generated file here that is not a pure function of the source tree.
      #
      # `build:sitemap` joined this list in TASK-FREE3-05. It runs in every build
      # (package.json) and its output declares itself "GENERATED, NEVER HAND-EDITED",
      # yet sitemap.xml/robots.txt were never diffed — a route added without
      # rebuilding shipped a stale committed sitemap silently. Making it guardable
      # required first making it deterministic: the old git-derived `<lastmod>` was
      # re-dated wholesale by any merge commit and unknowable in a shallow clone
      # (see the determinism note in scripts/build-sitemap.ts). Template `createdAt`
      # — declared, committed registry data — is the only lastmod left.
      #
      # The three screenshot/asset generators (`yarn og`, `yarn thumbnails`,
      # `yarn brand-assets`) are NOT in this list, and that is now a written
      # decision rather than an oversight: re-shooting Chromium screenshots on a
      # runner diffs on font hinting and GPU rasterisation, not on content. Their
      # COUNT is checked instead — build:og bakes THUMBNAIL_COVERAGE into
      # ogImages.ts (diffed below) and src/templates/thumbnailCoverage.spec.ts
      # fails if coverage drops. Rationale: apps/landing/scripts/README.md
      # § "Committed screenshot assets".
      - name: Landing generated artifacts unchanged
        run: |
          yarn workspace @dzup-ui/landing build:registry
          yarn workspace @dzup-ui/landing build:animations-registry
          yarn workspace @dzup-ui/landing build:component-index
          yarn workspace @dzup-ui/landing build:counts
          yarn workspace @dzup-ui/landing build:sitemap
          yarn workspace @dzup-ui/landing build:og
          yarn workspace @dzup-ui/landing build:releases
          git diff --exit-code \
            apps/landing/public/r/ \
            apps/landing/public/llms.txt \
            apps/landing/public/llms-full.txt \
            apps/landing/public/feed.xml \
            apps/landing/public/sitemap.xml \
            apps/landing/public/robots.txt \
            apps/landing/index.html \
            apps/landing/src/generated/components.ts \
            apps/landing/src/generated/counts.ts \
            apps/landing/src/generated/ogImages.ts \
            apps/landing/src/generated/releases.ts
          # `git diff` is blind to UNTRACKED files, so a generator that starts
          # emitting a NEW artifact passes the check above while that artifact
          # never ships — it regenerates on the runner, is never committed, and
          # 404s in production. Found in TASK-FREE3-02: the animations registry
          # began emitting a shared `motion-tokens.css` that every item's
          # `meta.stylesheet` points at, and the diff above saw nothing.
          untracked="$(git ls-files --others --exclude-standard \
            apps/landing/public/r/ \
            apps/landing/public/ \
            apps/landing/src/generated/)"
          if [ -n "$untracked" ]; then
            echo "::error::Generated artifacts were emitted but never committed:"
            echo "$untracked"
            exit 1
          fi
      - name: Changelog validation
        run: yarn validate:changelog
      - name: Peer dependency validation
        run: yarn validate:peers
      - name: License audit
        run: yarn validate:licenses
      # Every external URL on the apps' identity surfaces (footer, CTAs, README,
      # MDX guides, MCP manifests) must resolve — the footer shipped four broken
      # badges and two dead social links because nothing ever fetched them
      # (TASK-FREE-11). Rate-limited hosts are allowlisted inside the script.
      - name: External link check (identity surfaces)
        run: yarn check:links

  # ──────────────────────────────────────────────
  # G1: Merge Gates (main branch)
  # ──────────────────────────────────────────────

  build:
    name: Build (library mode)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build all packages
        run: yarn build
      - name: Verify ESM-only output (no CJS)
        run: |
          # ADR-11: ESM-only distribution
          if find packages/core/dist -name "*.cjs" -o -name "*.cjs.js" | grep -q .; then
            echo "ERROR: CJS output detected — ADR-11 violation"
            exit 1
          fi
          echo "ESM-only output verified"
      - name: Verify dist artifacts exist
        run: |
          test -f packages/contracts/dist/index.js || (echo "contracts/dist/index.js missing" && exit 1)
          test -f packages/tokens/dist/index.js || (echo "tokens/dist/index.js missing" && exit 1)
          test -f packages/core/dist/index.js || (echo "core/dist/index.js missing" && exit 1)
          test -f packages/compat/dist/index.js || (echo "compat/dist/index.js missing" && exit 1)
          test -f packages/codemods/dist/index.js || (echo "codemods/dist/index.js missing" && exit 1)
          test -f packages/nuxt/dist/module.js || (echo "nuxt/dist/module.js missing" && exit 1)
          echo "Build artifacts verified"
      # The hand-written list above only ever covered the JS entry of each package —
      # `./styles` → dist/core.css and all 11 family subpaths were missing from the
      # build for months without it noticing. This check is derived from the exports
      # map itself, so it cannot drift: --built makes a missing dist an error rather
      # than a skip. The `validate` job runs the same script pre-build (source checks).
      - name: Verify every export target exists in dist
        run: yarn validate:exports --built
      - name: Validate type declarations
        run: yarn validate:dts
      - name: Bundle budget check
        run: yarn validate:bundle
      - name: Bundle budget check (CI report)
        run: npx tsx packages/tooling/src/bundle-budget-check.ts --ci
      - name: Per-component size report
        run: npx tsx packages/tooling/src/component-size-report.ts --top=30
      - name: Pack smoke test (all publishable packages)
        run: |
          for pkg in contracts tokens core compat codemods nuxt; do
            echo "--- packing packages/$pkg ---"
            (cd packages/$pkg && npm pack --dry-run 2>&1) | tee /tmp/pack-$pkg.txt
            if grep -q "link:" /tmp/pack-$pkg.txt; then
              echo "ERROR: link: dependency in packages/$pkg tarball"
              exit 1
            fi
            if grep -q "workspace:" /tmp/pack-$pkg.txt; then
              echo "ERROR: workspace: dependency in packages/$pkg tarball"
              exit 1
            fi
          done
          echo "Pack smoke test passed for all packages"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/core/dist/
          retention-days: 7

  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      # The Storybook resolves @dzup-ui/core from dist, and build:playground reads
      # packages/tokens/dist/tokens.css. `packages/*/dist` is gitignored, so both
      # must be BUILT here — building only tokens (as this job used to) made the job
      # structurally red on every run.
      - name: Build packages
        run: yarn build
      # TASK-FREE2-12 — the per-component playground snippets are generated from each
      # component's `@example` (build-playground-snippets.mjs). Unlike its gitignored
      # `_data/*.generated.ts` siblings this file is COMMITTED, because the docs block
      # that reads it is reachable from `.storybook/preview.ts`, which the `storybook-test`
      # job loads with no generation step — a gitignored import there would make that job
      # structurally red (the trap the landing's untracked generated files hit). This
      # guard proves the committed copy is still a pure function of the component source.
      - name: Playground snippets in sync with component sources
        run: |
          yarn workspace @dzup-ui/storybook build:playground-snippets
          git diff --exit-code apps/storybook/stories/_data/playgroundSnippets.generated.ts
      - name: Build Storybook
        run: yarn storybook:build
      # `storybook:build` runs build:llms; these files are consumed by machines,
      # so validate the generated structure (balanced fences, non-ragged tables,
      # single H1) rather than trusting the generator.
      - name: Validate generated llms.txt
        run: yarn workspace @dzup-ui/storybook validate:llms
      # Asserts the built index.json against what the docs claim (TASK-FREE-11 +
      # TASK-FREE2-02/03). Three things, all resolved against the REAL story index
      # of the build above rather than by inspection:
      #   1. every `?path=/docs/<id>` in the MDX guides + _blocks resolves — two
      #      shipped dead for months because nothing checked;
      #   2. no page links CLAUDE.md (internal agent instructions) or a
      #      filesystem-relative path that cannot resolve from a docs iframe;
      #   3. sidebar sentinels: no `visual-refresh-*` id leaked into the public
      #      build, and `Guides/Design Tokens` still built (it shares the excluded
      #      _gallery/ directory, so an over-broad glob would silently drop it).
      - name: Check MDX links + sidebar sentinels against built index
        run: yarn workspace @dzup-ui/storybook check:mdx-links
      # The "Try it now" REPL is the first interactive thing a new user touches and
      # the most fragile surface here: custom compiler-sfc resolution, a sandbox
      # import map, the Tailwind browser CDN, a MutationObserver theme bridge, and
      # stylesheet filenames agreed on in two files that nothing ties together. It
      # shipped 404ing on a link to a stylesheet the build never wrote, and with a
      # theme bridge that never fired, because no machine ever opened it. Now one
      # does: this drives the real static build in Chromium and fails on a dead
      # asset, an unstyled/non-reactive component, or a broken theme toggle.
      - name: Install Playwright Chromium
        run: yarn workspace @dzup-ui/storybook exec playwright install --with-deps chromium
      # Also drives the TASK-FREE2-12 per-component "Open in playground": it opens a
      # cross-family sample of component docs pages (DzButton / DzTable / DzSelect),
      # expands the playground, and asserts the DERIVED snippet actually mounts —
      # compile-validation at build time proves a snippet parses, this proves it runs.
      - name: Verify REPL playground (live render, no 404s, per-component deep links)
        run: yarn workspace @dzup-ui/storybook verify:repl
      # TASK-X.7 — track the docs build's total size as a NON-BLOCKING metric.
      # `yarn validate:bundle` budgets packages/*/dist (the shipped library); this
      # covers the Storybook static build, which nothing else watched. It always
      # exits 0 for now and writes a shields.io size badge into the uploaded
      # artifact; promote to an enforced budget later with `check:size --max-mb <n>`.
      - name: Storybook build-size metric (non-blocking)
        run: yarn workspace @dzup-ui/storybook check:size --badge storybook-static/size-badge.json
      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: apps/storybook/storybook-static/
          retention-days: 7

  storybook-test:
    name: Storybook Tests (play + a11y)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build token artifacts
        run: yarn workspace @dzup-ui/tokens build
      - name: Install Playwright Chromium
        run: yarn workspace @dzup-ui/storybook exec playwright install --with-deps chromium
      # TASK-0.9 / TASK-X.3 — runs every story's play() + WCAG 2.2 AA axe audit
      # in-browser. The a11y gate rolls out per family (preview.ts): the default
      # is report-only, but any family opted into `a11yError` runs at 'error', so
      # a violation there fails this step and blocks the PR. Reporters write the
      # per-story results (incl. axe violation detail) to apps/storybook/a11y-report
      # for the artifact below — a11y findings are visible even while report-only.
      # DZUP_APP_SPECIFIC=1 — the `Core/Feedback/App-Specific/*` badges are excluded
      # from the PUBLISHED build (TASK-FREE2-06), but they are still shipped, exported
      # components with internal consumers, so they must still be TESTED. This runner
      # takes its story list from `.storybook/main.ts`, so without the flag the four
      # would drop out of play() + a11y silently — unpublishing would have quietly
      # become untesting. The published artifact is built by the separate `storybook`
      # job, which runs WITHOUT the flag and asserts the ids are absent.
      - name: Run Storybook tests (play + WCAG 2.2 AA a11y audit)
        run: yarn workspace @dzup-ui/storybook test-storybook:ci
        env:
          DZUP_APP_SPECIFIC: '1'
      # Publish the a11y/test results even when the step above fails, so a gated
      # violation is inspectable from the run without re-running locally.
      - name: Upload Storybook a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-a11y-report
          path: apps/storybook/a11y-report/
          retention-days: 7
      # TASK-0.10 — coverage is a barometer for untested states, not a 100% gate.
      - name: Upload Storybook coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-coverage
          path: apps/storybook/coverage/
          retention-days: 7

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run functional E2E tests (Chromium)
        timeout-minutes: 20
        run: yarn test:e2e:functional --project=chromium
      - name: Run visual snapshot tests (Chromium, report-only)
        id: visual
        timeout-minutes: 20
        continue-on-error: true
        run: yarn test:e2e:visual --project=chromium --retries=0
      - name: Upload Playwright report
        if: failure() || steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The landing's own browser suite (TASK-FREE3-06). Until this job existed, 1,953
  # unit tests ran in jsdom and the ONLY real browser that touched the landing in
  # CI was a single pixel-histogram spec — pointed at the DEV SERVER, not the
  # artifact that ships. Nav, the ⌘K palette, 404s, the theme toggle and the skip
  # link had never run in a real browser here, the hero snapshot silently skipped
  # on ubuntu (win32-only baselines), and no mobile viewport was ever driven.
  #
  # Gating, not report-only: every assertion in apps/landing/e2e is something jsdom
  # structurally cannot make (real focus, real chunk fetches, real painting, the
  # real SPA history fallback), so a failure here is a real user-visible break.
  landing-e2e:
    name: Landing E2E (built dist)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      # The landing imports @dzup-ui/core + @dzup-ui/contracts from SOURCE (see the
      # aliases in apps/landing/vite.config.ts), but `@dzup-ui/tokens/css` and
      # `/tailwind` resolve to packages/tokens/dist — generated, gitignored — so
      # tokens must be built or the site ships with no design tokens at all.
      - name: Build contracts + design tokens
        run: yarn workspace @dzup-ui/contracts build && yarn workspace @dzup-ui/tokens build
      # LANDING_SKIP_STORYBOOK=1 — build the landing WITHOUT bundling the Storybook.
      #
      # Every flow in apps/landing/e2e stays inside the landing SPA, so mounting a
      # multi-minute Storybook build under /storybook/ would buy this job nothing and
      # cost it most of its budget. The `landing-perf` job builds the real thing and
      # `check:storybook` asserts dist/storybook/index.html is there, so the mount is
      # still gated — just not here.
      #
      # The one rule this implies: a flow added to this suite must not navigate into
      # /storybook/. That includes the ⌘K palette's COMPONENT rows, which
      # `window.location.assign` into the docs app — the palette flow deliberately
      # selects a BLOCK row. Lift this flag before testing anything that leaves the SPA.
      - name: Build landing site (no Storybook mount)
        run: yarn workspace @dzup-ui/landing build
        env:
          LANDING_SKIP_STORYBOOK: '1'
      - name: Install Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      # LANDING_E2E_TARGET=preview (set by the script) swaps the dev server for
      # `vite preview` over apps/landing/dist: minified, code-split, real asset URLs,
      # the SPA history fallback. Both Playwright projects run — Desktop Chrome for
      # the flows + hero baselines, Pixel 7 for the drawer and a block page.
      - name: Landing e2e (flows + visual + mobile, against dist)
        run: yarn test:e2e:landing:preview
      # Deliberately re-runs block-responsive.spec.ts, which the full suite above
      # already covered — because it runs it under a STRICTER contract, not a
      # duplicate one. The suite above inherits `retries: 2` from
      # playwright.config.ts, so a responsive assertion that fails then passes on
      # retry is laundered into a green run. `--fail-on-flaky-tests` refuses that:
      # a block whose layout only holds together on the second attempt is not
      # certified. `--workers=2` bounds the sweep (every block × 3 viewports × 2
      # text directions) so the parallelism itself cannot be the source of flake.
      #
      # Cheap where it sits: the dist is built and Chromium installed by the steps
      # above, which is why this gate lives here rather than in `landing-perf`.
      #
      # LANDING_E2E_TARGET=preview is set here, not baked into the script: the
      # script is also the one-block local command (`yarn test:responsive:landing`),
      # where the dev server is the right target. Without it this step would cold-
      # start Vite on the dev port and certify source instead of the artifact.
      - name: Certify every block across widths and text directions
        run: yarn test:responsive:landing:ci
        env:
          LANDING_E2E_TARGET: preview
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: landing-e2e-report
          path: |
            apps/landing/playwright-report/
            apps/landing/test-results/
          retention-days: 7

  landing-perf:
    name: Landing Perf (Lighthouse + bundle budget)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      # Build order matters: tokens → core → storybook → landing.
      #
      # The landing app imports @dzup-ui/core + @dzup-ui/contracts from source
      # (see apps/landing/vite.config.ts aliases), but @dzup-ui/tokens/css and
      # /tailwind resolve to packages/tokens/dist — so tokens must be built first.
      #
      # The landing site then MOUNTS the Storybook at /storybook/ (its "Components"
      # CTA, every docs link, every ⌘K palette row). apps/storybook/storybook-static
      # is gitignored, so it does not exist on this runner until we build it — and
      # the Storybook build itself consumes packages/core/dist. Skipping either of
      # these once produced a green landing build that deployed a 404 front door.
      - name: Build contracts + design tokens
        run: yarn workspace @dzup-ui/contracts build && yarn workspace @dzup-ui/tokens build
      - name: Build core (Storybook consumes packages/core/dist)
        run: yarn workspace @dzup-ui/core build
      - name: Build Storybook (mounted at /storybook/ by the landing build)
        run: yarn storybook:build
      # Two browser gates used to run here, against the DEV SERVER: the blank-page
      # guard (light AND dark pixel histograms, `--grep`-ed to skip the hero
      # baselines) and the per-block responsive certification. Both have moved to
      # the `landing-e2e` job (TASK-FREE3-06), which drives the BUILT dist.
      #
      # What they guard is unchanged and still worth stating. A `mix-blend-mode` on
      # <html> once screen-blended the whole document against the white canvas, so
      # dark mode painted every pixel white while the DOM, computed styles, scroll
      # height and console all looked perfectly healthy. Only a PIXEL check catches
      # that class of bug — and only if the run sets `prefers-color-scheme: dark`,
      # which Playwright does NOT do by default.
      #
      # Keeping a second, weaker copy of either here would cost this job a Chromium
      # install and a dev-server boot to assert less than `landing-e2e` already does.
      - name: Build landing site
        run: yarn workspace @dzup-ui/landing build
      # The artifact we measure must be the artifact users get. Assert the built
      # dist actually mounts the Storybook: `dist/storybook/index.html` exists and
      # is non-empty. The plugin already throws on a missing input; this guards the
      # OUTPUT so the omission can never again be silent.
      - name: Assert /storybook/ is mounted in dist
        run: yarn workspace @dzup-ui/landing check:storybook
      # Payload budget (gzip) for the first-paint JS/CSS — asserts the bytes that
      # produce the Core Web Vitals, and writes the shields.io perf badge endpoint.
      - name: Landing bundle-size budget + perf badge
        run: yarn workspace @dzup-ui/landing check:bundle --badge dist/perf-badge.json
      # Lab Core Web Vitals across 5 routes (/, /blocks, /templates, /compare and a
      # block detail page) — hard-asserts LCP < 2.5s, CLS < 0.1 and accessibility
      # >= 0.9 (advisory warnings for perf score, TBT, FCP). Reports upload to
      # temporary public storage; the run URL is printed in the step log.
      #
      # Two runs, because Lighthouse takes one form factor per config and desktop is
      # the kinder of the two: no CPU throttling, fast link. Mobile emulates a
      # mid-tier phone on throttled 4G, which is where a payload regression actually
      # shows up. `lighthouserc.spec.ts` asserts the two configs agree on URLs and
      # thresholds, so the only variable here is the device.
      - name: Lighthouse CI — desktop (LCP < 2.5s, CLS < 0.1, a11y >= 0.9)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./apps/landing/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Lighthouse CI — mobile (LCP < 2.5s, CLS < 0.1, a11y >= 0.9)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./apps/landing/lighthouserc.mobile.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      # Publish the perf badge + Lighthouse results as a downloadable artifact so
      # the score is inspectable from the run even when an assertion fails.
      - name: Upload landing perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-perf
          path: |
            apps/landing/dist/perf-badge.json
            .lighthouseci/
          retention-days: 7

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run coverage with threshold enforcement
        # vitest.config.ts owns both the global package bar and the measured
        # active-app ratchet. CLI overrides replace that nested policy.
        run: yarn test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
