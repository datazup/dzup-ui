<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>dzup-ui — The Vue 3 component library for serious products</title>

    <!-- Site icon set + web manifest — generated by scripts/build-brand-assets.mts
         (committed identity assets; the SVG mark is shared with the Storybook). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      Paired theme-color, so the browser/OS chrome follows the page (TASK-FREE3-08).
      A single static value left the address bar and task-switcher card painted in
      the LIGHT brand blue while the site itself rendered dark.

      Light stays `#0766ee` (`--dz-colors-primary-500`) — the value
      `site.webmanifest` and `favicon.svg` already agree on, and changing it would
      break that agreement for no gain. Dark is `#004ecb`
      (`--dz-colors-primary-600`), the ramp's own darker step: still unmistakably
      the brand, but a surface that belongs beside a dark page rather than glowing
      against it. Both are recomputed from tokens.css by
      `landing-token-fallbacks.spec.ts`.

      Media-query metas cover the OS preference. They cannot see the site's MANUAL
      override (the `dz-theme` localStorage choice a visitor makes with the toggle)
      — no CSS media query can. `src/composables/useTheme.ts` keeps that case
      honest by rewriting the active tag whenever it writes `data-theme`.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0766ee" data-scheme="light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#004ecb" data-scheme="dark" />

    <!-- Atom feed autodiscovery — the /changelog history as a subscribable feed.
         A fixed URL (cannot drift); scripts/build-releases.ts fails the build if
         this link is ever removed so the generated feed stays discoverable. -->
    <link rel="alternate" type="application/atom+xml" title="dzup-ui changelog" href="/feed.xml" />

    <!--
      The four description strings below (meta, og, twitter, JSON-LD) are WRITTEN
      AT BUILD TIME by `scripts/build-counts.ts` from `src/lib/seo.ts`, so the
      counts search engines and social cards quote can never drift from the real
      catalog. Edit the copy in `src/lib/seo.ts`, not here — `src/claims.spec.ts`
      reads this file back and fails if a hand-typed number reappears.
    -->
    <meta
      name="description"
      content="138 accessible, open-source Vue 3 components across 11 families. Built on Tailwind CSS 4, an OKLCH token system, and Reka UI accessible primitives. Light & dark out of the box."
    />
    <link rel="canonical" href="https://dzup-ui.com/" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dzup-ui.com/" />
    <meta property="og:title" content="dzup-ui — The Vue 3 component library for serious products" />
    <meta
      property="og:description"
      content="138 accessible, open-source Vue 3 components. One token system. Light & dark out of the box."
    />
    <!-- Site-wide share image (1200×630 PNG, generated by build-brand-assets.mts).
         Absolute URL — crawlers do not resolve relative og:image paths. Routes
         without their own share image inherit this via DEFAULT_HEAD (src/router.ts). -->
    <meta property="og:image" content="https://dzup-ui.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="dzup-ui — The Vue 3 component library for serious products" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dzup-ui.com/og-default.png" />
    <meta name="twitter:title" content="dzup-ui — The Vue 3 component library for serious products" />
    <meta
      name="twitter:description"
      content="138 accessible, open-source Vue 3 components. One token system. Light & dark out of the box."
    />

    <!--
      Structured data (schema.org): the library as a SoftwareApplication, so search
      engines and AI answer engines can attribute the free Vue 3 component library.
      Site-wide + static here (crawlable without JS, like the canonical/OG above);
      per-route BreadcrumbList JSON-LD is injected client-side by the router head
      mechanism (src/router.ts) on the block/template detail pages.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "dzup-ui",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "url": "https://dzup-ui.com/",
        "description": "138 accessible, open-source Vue 3 components across 11 families. Built on Tailwind CSS 4, an OKLCH token system, and Reka UI accessible primitives. Light & dark out of the box.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Organization", "name": "dzup-ui", "url": "https://dzup-ui.com/" }
      }
    </script>

    <!--
      FOUC prevention (ADR-15): reads 'dz-theme' from localStorage and sets
      data-theme on <html> before any CSS or Vue renders. Canonical script from
      @dzup-ui/core/providers — do not edit this IIFE manually; update themeScript instead.
    -->
    <script>(function(){try{var s=localStorage.getItem('dz-theme');var t=s==='light'||s==='dark'?s:null;if(!t){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
    <style>
      /* Prevent FOUC — set base styles before Vue mounts */
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: var(--dz-font-sans, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
        background: var(--dz-background, #ffffff);
        color: var(--dz-foreground, #1a202c);
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
