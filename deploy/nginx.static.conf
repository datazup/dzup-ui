server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Browser security headers (UI-DZUP-UI-SEC-L-08). nginx does NOT inherit
  # add_header into a location that declares its own add_header, so every such
  # location below repeats this exact block; packages/tooling/src/deploy/
  # static-headers.spec.ts fails if one is missing. The CSP restricts only
  # framing, plugins and <base> (the docs playground and Storybook frame
  # same-origin pages); script/style policy is not enforced here. HSTS belongs
  # to the TLS terminator in front of this container, not to a :8080 listener.
  add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }

  location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }
}
